namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: identity
  imageTag: b97f9e7a7fa29cecded4c0509a8f1793a2fbee19
  port: 4001
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

secretName: identity-secret

config:
  PORT: "4001"
  JWT_ISSUER: "https://identity.wohlig.com"
  JWT_ACCESS_TOKEN_TTL_SECONDS: "900"
  FRONTEND_URLS: "https://hiring-candidate-portal.wohlig.com,https://hiring-recruiter-portal.wohlig.com,https://hiring-admin-console.wohlig.com"
