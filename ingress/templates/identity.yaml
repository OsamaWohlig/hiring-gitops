apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: identity
  namespace: hiring-system
spec:
  routes:
    - loadBalancerPolicy:
        strategy: WeightedLeastRequest
      services:
        - name: identity
          port: 80
      timeoutPolicy:
        idle: infinity
  virtualhost:
    corsPolicy:
      allowCredentials: true
      allowHeaders:
        - '*'
      allowMethods:
        - GET
        - POST
        - OPTIONS
        - PUT
        - DELETE
        - PATCH
      allowOrigin:
        - '*'
      exposeHeaders:
        - Content-Length
        - Content-Range
      maxAge: 10m
    fqdn: hiring-identity.wohlig.com
