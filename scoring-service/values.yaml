namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: scoring-service
  imageTag: 3b2e92c8725bef39665b653ffa77ea33e7801627
  port: 4004
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

secretName: scoring-service-secret

config:
  PORT: "4004"
  JWT_ISSUER: "https://identity.wohlig.com"
  SEED_DATABASE_URL: "postgres://postgres:postgres@localhost:55432/postgres"

# Ingress configuration
ingress:
  enabled: true
  fqdn: hiring-scoring.wohlig.com
  tls:
    enabled: false
    secretName: ""
