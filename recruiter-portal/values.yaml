namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: recruiter-portal
  imageTag: 98be87b23de8f5722a1386bf60804b0eea9c6c99
  port: 8080
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

# Ingress configuration
ingress:
  enabled: true
  fqdn: hiring-recruiter-portal.wohlig.com
  tls:
    enabled: false
    secretName: ""
