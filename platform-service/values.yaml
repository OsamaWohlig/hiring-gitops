namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: platform-service
  imageTag: b97f9e7a7fa29cecded4c0509a8f1793a2fbee19
  port: 4007
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

secretName: platform-service-secret

config:
  PORT: "4007"
  PLATFORM_JWT_ISSUER: "https://platform.wohlig.com"
  SUPERADMIN_FRONTEND_URL: "https://hiring-superadmin-console.wohlig.com"
  SEED_DATABASE_URL: "postgres://postgres:postgres@localhost:55432/postgres"

# Ingress configuration
ingress:
  enabled: true
  fqdn: hiring-platform.wohlig.com
  tls:
    enabled: false
    secretName: ""
