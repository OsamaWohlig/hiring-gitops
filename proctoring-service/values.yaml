namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: proctoring-service
  imageTag: aaea30d3846d0de4c4fe56690aca4d5959c2bc5a
  port: 4006
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

secretName: proctoring-service-secret

config:
  PORT: "4006"
  JWT_ISSUER: "https://identity.wohlig.com"
  SEED_DATABASE_URL: "postgres://postgres:postgres@localhost:55432/postgres"

# Ingress configuration
ingress:
  enabled: true
  fqdn: hiring-proctoring.wohlig.com
  tls:
    enabled: false
    secretName: ""
