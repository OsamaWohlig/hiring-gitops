namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: candidate-portal
  imageTag: e4a2faf98e93a7f514f5bad36ce97dc0c81bf9ff
  port: 8080
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

# Ingress configuration
ingress:
  enabled: true
  fqdn: hiring-candidate-portal.wohlig.com
  tls:
    enabled: false
    secretName: ""
