namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: candidate-portal
  imageTag: 70ea0fa8a1d3851a231f019b6ec720219be36d8a
  port: 8080
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

# Ingress configuration
ingress:
  enabled: true
  fqdn: hiring-candidate-portal.wohlig.com
  tls:
    enabled: false
    secretName: ""
