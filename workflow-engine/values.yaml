namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: workflow-engine
  imageTag: 703465b0089ed169a2643e4814e6a5336dcf1f61
  port: 4002
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

secretName: workflow-engine-secret

config:
  PORT: "4002"
  JWT_ISSUER: "https://identity.wohlig.com"
  ASSESSMENT_SERVICE_URL: "http://assessment-service"
  NOTIFICATION_SERVICE_URL: "http://notification-service"
  INTERVIEW_SERVICE_URL: "http://interview-service"
  FRONTEND_URL: "https://hiring-candidate-portal.wohlig.com"
  RECRUITER_PORTAL_URL: "https://hiring-recruiter-portal.wohlig.com"
  HIRING_ALERT_EMAIL: "shreya.dandare@wohlig.com"
  CALENDAR_ORGANIZER_EMAIL: "priyal.makwana@wohlig.com"

# Ingress configuration
ingress:
  enabled: true
  fqdn: hiring-workflow-engine.wohlig.com
  tls:
    enabled: false
    secretName: ""
