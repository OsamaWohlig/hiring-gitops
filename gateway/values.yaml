namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: gateway
  imageTag: 70ea0fa8a1d3851a231f019b6ec720219be36d8a
  port: 4000
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

# Reference to Kubernetes Secret
secretName: gateway-secret

# Non-sensitive config
config:
  PORT: "4000"
  JWT_ISSUER: "https://identity.wohlig.com"
  IDENTITY_URL: "http://identity"
  WORKFLOW_URL: "http://workflow-engine"
  INTERVIEW_URL: "http://interview-service"
  ASSESSMENT_URL: "http://assessment-service"
  PROCTORING_URL: "http://proctoring-service"
  NOTIFICATION_URL: "http://notification-service"
  SCORING_URL: "http://scoring-service"
  PLATFORM_URL: "http://platform-service"
  PLATFORM_JWT_ISSUER: "https://platform.wohlig.com"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "100"

# Ingress configuration
ingress:
  enabled: true
  fqdn: hiring-gateway.wohlig.com
  tls:
    enabled: false
    secretName: ""
