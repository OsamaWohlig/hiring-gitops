namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: superadmin-console
  imageTag: 92eefd74e3c51b73f1ba7ad1f20771f13508ca9b
  port: 8080
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

# Ingress configuration
ingress:
  enabled: true
  fqdn: hiring-superadmin-console.wohlig.com
  tls:
    enabled: false
    secretName: ""
