namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: superadmin-console
  imageTag: 5e300f59d96157c6d53e0fac5c02e0e633d4522f
  port: 8080
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

# Ingress configuration
ingress:
  enabled: true
  fqdn: hiring-superadmin-console.wohlig.com
  tls:
    enabled: false
    secretName: ""
