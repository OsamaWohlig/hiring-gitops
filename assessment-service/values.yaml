namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: assessment-service
  imageTag: 92eefd74e3c51b73f1ba7ad1f20771f13508ca9b
  port: 4003
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

secretName: assessment-service-secret

config:
  PORT: "4003"
  JWT_ISSUER: "https://identity.wohlig.com"
  CANDIDATE_PORTAL_URL: "https://hiring-candidate-portal.wohlig.com"
  WORKFLOW_URL: "http://workflow-engine"
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  NOTIFICATION_URL: "http://notification-service"
  SEED_DATABASE_URL: "postgres://postgres:postgres@localhost:55432/postgres"
  LLM_PROVIDER: "gemini"
  GOOGLE_CLOUD_PROJECT: "wohlig"
  GOOGLE_CLOUD_LOCATION: "global"

# Ingress configuration
ingress:
  enabled: true
  fqdn: hiring-assessment.wohlig.com
  tls:
    enabled: false
    secretName: ""
