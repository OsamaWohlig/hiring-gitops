namespace: hiring-system
serviceAccountName: default
registry: asia-south1-docker.pkg.dev
projectId: wohlig
repository: hiring-system

service:
  name: notification-service
  imageTag: aaea30d3846d0de4c4fe56690aca4d5959c2bc5a
  port: 4005
  replicas: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

secretName: notification-service-secret

config:
  PORT: "4005"
  JWT_ISSUER: "https://identity.wohlig.com"
  NOTIFICATION_PROVIDER: "smtp"
  NOTIFICATION_FROM: "ltcekk26@gmail.com"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  WHATSAPP_PROVIDER: "gupshup"
  GUPSHUP_SOURCE_NUMBER: "+917834811114"
  GUPSHUP_APP_NAME: "HiringSystem"
  SEED_DATABASE_URL: "postgres://postgres:postgres@localhost:55432/postgres"

# Ingress configuration
ingress:
  enabled: true
  fqdn: hiring-notification.wohlig.com
  tls:
    enabled: false
    secretName: ""
